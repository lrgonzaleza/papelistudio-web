    <!-- LOGIN -->
    <section class="section" id="login">
        <div class="container">
            <h2 class="section-title">Iniciar Sesión</h2>
            <p style="color: var(--muted); margin-bottom: 20px;">
                Ingresa tus datos para acceder a tu cuenta ✨
            </p>

            <form class="login-form" action="login_usuario.php" method="post">
            <div class="form-group">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" placeholder="Ej: nombre@correo.com" required>
            </div>

            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" placeholder="********" required>
            </div>

            <button type="submit" class="btn primary">Ingresar</button>

            <p class="form-footer">
                ¿No tienes una cuenta?
                <a href="Registro.html" style="color: var(--magenta); font-weight: 600;">Regístrate aquí</a>
            </p>
            </form>
        </div>
    |</section>
